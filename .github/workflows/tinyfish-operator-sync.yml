name: Operator TinyFish regulatory synchronization

# This is manual-only. No recurring paid calls are made by GitHub Actions.
on:
  workflow_dispatch:
    inputs:
      reporting_period:
        description: 'Verified CDSCO period, MON-YYYY (e.g. AUG-2026)'
        required: true
        type: string
      max_records:
        description: 'Max records for this one retrieval, 1-25'
        required: true
        default: '10'
        type: string

permissions:
  contents: read

concurrency:
  group: pharmaone-regulatory-ingestion
  cancel-in-progress: false

jobs:
  sync:
    # Protected production environment should have required reviewers.
    environment: pharmaone-regulatory-operator
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PHARMAONE_ENV: production
      DATABASE_URL: ${{ secrets.PHARMAONE_DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.PHARMAONE_SUPABASE_URL }}
      ALLOWED_ORIGINS: https://pharma-one-six.vercel.app
      TINYFISH_API_KEY: ${{ secrets.PHARMAONE_TINYFISH_API_KEY }}
      PERIOD: ${{ inputs.reporting_period }}
      LIMIT: ${{ inputs.max_records }}
    steps:
      - name: Validate configuration without displaying secrets
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PERIOD" =~ ^(JAN|FEB|MAR|APR|MAY|JUN|JUL|AUG|SEP|OCT|NOV|DEC)-20[0-9]{2}$ ]] || { echo "Invalid period"; exit 1; }
          [[ "$LIMIT" =~ ^[0-9]+$ ]] && (( LIMIT >= 1 && LIMIT <= 25 )) || { echo "Invalid limit"; exit 1; }
          [[ "$DATABASE_URL" == postgresql+psycopg://* ]] || { echo "Database secret missing or malformed"; exit 1; }
          [[ "$SUPABASE_URL" == https://* ]] || { echo "Supabase URL missing"; exit 1; }
          [[ -n "$TINYFISH_API_KEY" ]] || { echo "TinyFish key missing"; exit 1; }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c # v4.2.2
        with:
          persist-credentials: false
      - name: Install backend
        working-directory: api
        run: python3 -m pip install -r requirements.txt
      - name: Retrieve one period through TinyFish Agent and synchronize
        working-directory: api
        shell: bash
        run: python3 -m app.ingest_service "$PERIOD" --limit "$LIMIT" --max-requests 1
